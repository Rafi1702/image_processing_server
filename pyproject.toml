[project]
name = "image_processing_server"
version = "0.1.0"
requires-python = ">=3.9.6"
dependencies = [
    "scikit-learn>=1.0",
    "pandas>=2.0",
    "opencv-python>=4.9.0",
    "PyGObject>=3.42.0",
    "pycairo>=1.21.0"
]

[tool.setuptools.packages.find]
where = ["."]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
